<script>
const $=i=>document.getElementById(i);
const msg=(t,bad)=>{const m=$('lmsg');m.textContent=t||'';m.classList.toggle('bad',!!bad)};
addEventListener('error',e=>msg('Error: '+(e.message||'skrip gagal'),true));
function miniSupa(url,key){
 const SK='hypix-session';let session=null;const subs=[];
 try{session=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}
 const save=x=>{session=x;try{x?localStorage.setItem(SK,JSON.stringify(x)):localStorage.removeItem(SK)}catch(e){}};
 const emit=ev=>subs.forEach(f=>{try{f(ev,session)}catch(e){}});
 const norm=d=>({access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+(d.expires_in||3600),user:d.user});
 const H=(tok)=>({apikey:key,Authorization:'Bearer '+(tok||key),'Content-Type':'application/json'});
 async function call(path,opt){
  try{const r=await fetch(url+path,opt);const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}
   if(!r.ok)return{data:null,error:{message:(j&&(j.message||j.msg||j.error_description||j.error))||('HTTP '+r.status),status:r.status}};
   return{data:j,error:null}}
  catch(e){return{data:null,error:{message:'Tidak bisa terhubung ke Supabase ('+e.message+')'}}}}
 async function fresh(){
  if(session&&session.refresh_token&&session.expires_at&&session.expires_at*1000<Date.now()+30000){
   const r=await call('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:H(),body:JSON.stringify({refresh_token:session.refresh_token})});
   if(r.error){save(null);emit('SIGNED_OUT')}else save(norm(r.data))}}
 function from(table){
  const q={m:'GET',params:[],body:null,prefer:[],single:false,cols:'*'};
  const o={
   select(c){q.cols=c||'*';return o},
   eq(c,v){q.params.push(c+'=eq.'+encodeURIComponent(v));return o},
   order(c){q.params.push('order='+encodeURIComponent(c)+'.asc');return o},
   maybeSingle(){q.single=true;return Promise.resolve(o.then(x=>x))},
   update(b){q.m='PATCH';q.body=b;return o},
   delete(){q.m='DELETE';return o},
   insert(b){q.m='POST';q.body=b;return o},
   upsert(b){q.m='POST';q.body=b;q.prefer.push('resolution=merge-duplicates');return o},
   then(res,rej){return exec().then(res,rej)}};
  async function exec(){
   await fresh();const ps=q.params.slice();
   if(q.m==='GET'){ps.unshift('select='+encodeURIComponent(q.cols));if(q.single)ps.push('limit=1')}
   const h=H(session&&session.access_token);
   if(q.m!=='GET')h.Prefer=['return=minimal'].concat(q.prefer).join(',');
   const r=await call('/rest/v1/'+table+(ps.length?'?'+ps.join('&'):''),{method:q.m,headers:h,body:q.body?JSON.stringify(q.body):undefined});
   if(!r.error&&q.single)r.data=Array.isArray(r.data)?(r.data[0]||null):r.data;
   return r}
  return o}
 const auth={
  async signInWithPassword(c){const r=await call('/auth/v1/token?grant_type=password',{method:'POST',headers:H(),body:JSON.stringify({email:c.email,password:c.password})});
   if(r.error)return{data:null,error:r.error};save(norm(r.data));emit('SIGNED_IN');return{data:{session},error:null}},
  async signUp(c){const r=await call('/auth/v1/signup',{method:'POST',headers:H(),body:JSON.stringify({email:c.email,password:c.password,data:(c.options&&c.options.data)||{}})});
   if(r.error)return{data:null,error:r.error};if(r.data&&r.data.access_token){save(norm(r.data));emit('SIGNED_IN')}return{data:r.data,error:null}},
  async signOut(){if(session)await call('/auth/v1/logout',{method:'POST',headers:H(session.access_token)});save(null);emit('SIGNED_OUT');return{error:null}},
  async getSession(){await fresh();return{data:{session},error:null}},
  onAuthStateChange(f){subs.push(f);return{data:{subscription:{unsubscribe(){}}}}},
  async signInWithOAuth(o){
   const to=(o&&o.redirectTo)||location.href.split('#')[0].split('?')[0];
   location.href=url+'/auth/v1/authorize?provider='+encodeURIComponent(o.provider)+'&redirect_to='+encodeURIComponent(to);
   return{error:null}},
  async sessionFromUrl(){
   const raw=location.hash.replace(/^#/,'')||location.search.replace(/^\?/,'');
   if(!raw)return{data:null,error:null};
   const p=new URLSearchParams(raw);
   const clean=()=>{try{history.replaceState(null,'',location.pathname)}catch(e){}};
   if(p.get('error')||p.get('error_description')){clean();return{data:null,error:{message:(p.get('error_description')||p.get('error')).replace(/\+/g,' ')}}}
   const at=p.get('access_token');if(!at)return{data:null,error:null};
   const u=await call('/auth/v1/user',{headers:H(at)});
   if(u.error){clean();return{data:null,error:u.error}}
   save(norm({access_token:at,refresh_token:p.get('refresh_token'),expires_in:+p.get('expires_in')||3600,expires_at:+p.get('expires_at')||0,user:u.data}));
   clean();emit('SIGNED_IN');return{data:{session},error:null}}};
 return{from,auth}}
const supa=miniSupa(SUPABASE_URL,SUPABASE_ANON_KEY);

$('tm').onclick=()=>setMode('in');$('td').onclick=()=>setMode('up');

async function lanjut(){
 let admin=false;
 try{
  const s=(await supa.auth.getSession()).data.session;
  const pr=await supa.from('profiles').select('role_id').eq('id',s.user.id).maybeSingle();
  if(pr.data&&pr.data.role_id){const rl=await supa.from('roles').select('can_edit').eq('id',pr.data.role_id).maybeSingle();admin=!!(rl.data&&rl.data.can_edit)}
 }catch(e){}
 location.href='index.html'+(admin?'#admin':'');
}
async function kirim(){
 const email=$('l_mail').value.trim(),password=$('l_pw').value;
 if(!email||!password){msg('Isi email dan password.',true);return}
 if(mode==='up'&&password.length<6){msg('Password minimal 6 karakter.',true);return}
 $('go').disabled=true;msg('Memproses...');
 const r=mode==='up'?await supa.auth.signUp({email,password,options:{data:{name:$('l_name').value.trim()}}}):await supa.auth.signInWithPassword({email,password});
 $('go').disabled=false;
 if(r.error){msg(ramah(r.error.message),true);return}
 const s=(await supa.auth.getSession()).data.session;
 if(s){msg('Berhasil! Mengalihkan...');await lanjut()}
 else{setMode('in');msg('Pendaftaran berhasil. Cek emailmu untuk konfirmasi, lalu masuk.')}
}

(async()=>{
