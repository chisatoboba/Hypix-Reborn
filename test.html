<!doctype html>
<html lang="id"><head><meta charset="utf-8">

<style>body{font:18px/1.6 system-ui,sans-serif;padding:20px;background:#fff;color:#111}
.b{padding:12px;border-radius:10px;margin:10px 0;border:2px solid #999}
.ok{background:#d8f5d0;border-color:#3f9f2c}.no{background:#fbdcdc;border-color:#c52f35}
button{font:inherit;padding:12px 18px}</style></head><body>
